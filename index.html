    <script>
      // Ignore Vite HMR / WebSocket module runner transport errors in AI Studio iframe
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('createWebSocketModuleRunnerTransport'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason ? String(event.reason) : '';
        if (reason.includes('WebSocket') || reason.includes('createWebSocketModuleRunnerTransport')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
